services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: file_processing
      POSTGRES_USER: file_processing_user
      POSTGRES_PASSWORD: file_processing_password
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI - open http://localhost:8025 to read sent verification emails

volumes:
  postgres-data:
