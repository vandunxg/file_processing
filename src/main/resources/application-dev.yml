spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/base_project}
    username: ${DB_USERNAME:base_user}
    password: ${DB_PASSWORD:base_password}

    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        generate_statistics: false

  flyway:
    enabled: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  web:
    error:
      include-message: always
      include-binding-errors: always
      include-stacktrace: on_param

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    com.example.baseproject: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:base-project-dev}
      audience: ${JWT_AUDIENCE:base-project-dev-api}

      secret: ${JWT_SECRET:dev-base-project-jwt-secret-key-change-me-2026}

      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}

    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}