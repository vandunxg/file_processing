spring:
  application:
    name: file_processing
    version: 1.0.0

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    banner-mode: console

  jackson:
    default-property-inclusion: non_null

  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${spring.application.name}-hikari
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME:300000}
      auto-commit: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: ${HIBERNATE_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${app.file-import.max-file-size}
      max-request-size: ${app.file-import.max-file-size}

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}

  shutdown: graceful

  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
      - text/css
      - application/javascript

  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

  forward-headers-strategy: framework

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}

  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: false

logging:
  file:
    path: /var/log/file-processing

  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

  pattern:
    console: >-
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      %-5level
      [%thread]
      [%X{traceId:-},%X{spanId:-}]
      %logger{36}
      - %msg%n

  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 10GB
      clean-history-on-start: false

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
    url: http://localhost:8080

  swagger-ui:
    enabled: true
    path: /swagger-ui
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

  packages-to-scan:
    - com.vandunxg.file_processing.auth.api

  paths-to-match:
    - ${app.api.prefix}/${app.api.version}/**

app:
  api:
    prefix: /api
    version: v1
  web:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000
      allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed-headers: ["*"]
      exposed-headers: [Retry-After, Content-Disposition, Location]
      allow-credentials: true
      max-age: PT30M
  file-import:
    max-file-size: 500MB
    retention: PT720H
    batch-size: 1000
    progress-row-interval: 5000
    progress-time-interval: PT2S
    stale-heartbeat-threshold: PT2M
    worker-threads: 1
    poll-interval: PT10M
    recovery-interval: PT10M
    staging-sweep-interval: PT10M
    retention-cleanup-interval: PT1H
    storage:
      r2:
        endpoint: ${R2_ENDPOINT}
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        bucket: ${R2_BUCKET}
        api-call-timeout: PT30S
  auth:
    password:
      encoder: bcrypt
      bcrypt-cost: 10
      min-length: 8
      max-length: 128
    register:
      max-attempts-per-hour: 10
    login:
      ip-max-per-window: 20
      ip-window: PT1H
      username-max-per-window: 5
      username-window: PT15M
      refresh-ip-max-per-window: 60
      refresh-ip-window: PT1M
      max-failures: 5
      failure-window: PT15M
      lock-duration: PT15M
    refresh:
      token-ttl: PT168H
      cookie-secure: true
    session:
      credential-version-cache-ttl: PT5M
    bootstrap:
      admin:
        enabled: false
        username: ""
        email: ""
        password: ""
        display-name: System Administrator
    jwt:
      issuer: file-processing
      audience: file-processing-api
      access-token-ttl: PT15M
      password-change-token-ttl: PT5M
      clock-skew: PT60S
      active-kid: ${APP_AUTH_JWT_ACTIVE_KID}
      private-key-pem-base64: ${APP_AUTH_JWT_PRIVATE_KEY_PEM_BASE64}
      public-keys:
        - kid: ${APP_AUTH_JWT_ACTIVE_KID}
          pem-base64: ${APP_AUTH_JWT_PUBLIC_KEY_PEM_BASE64}
    email-verification:
      token-ttl: PT24H
      base-url: http://localhost:5173/verify-email
      resend-max-attempts-per-hour: 10
    password-reset:
      token-ttl: PT15M
      base-url: https://app.example.com/reset-password
      ip-max-attempts-per-hour: 20
      identifier-max-attempts-per-window: 5
      identifier-window: PT15M
    cleanup:
      cadence: PT1H
      batch-size: 100
    redis:
      throttle:
        key-prefix: "auth:throttle:"
        window: PT1H
      email-verification:
        token-key-prefix: "auth:email-verify:token:"
        user-key-prefix: "auth:email-verify:user:"
      session:
        key-prefix: "auth:session:"
      refresh:
        key-prefix: "auth:refresh:"
        used-key-prefix: "auth:refresh:used:"
        reuse-detection-window: PT60S
      credential-version:
        key-prefix: "auth:user:cv:"
      user-sessions:
        key-prefix: "auth:user:sessions:"
    amqp:
      exchange: auth.events
      routing-key:
        action-log: auth.action-log.recorded
        audit-log: auth.audit-log.recorded
        verification-email: auth.email.verification-requested
        session-persist: auth.session.persist
        session-update: auth.session.update
        session-revoke: auth.session.revoke
      queue:
        action-log: auth.action-log.queue
        audit-log: auth.audit-log.queue
        verification-email: auth.email-verification.queue
        session-persist: auth.session-persist.queue
        session-update: auth.session-update.queue
        session-revoke: auth.session-revoke.queue
