spring:
  application:
    name: file_processing

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    banner-mode: console

  jackson:
    default-property-inclusion: non_null

  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${spring.application.name}-hikari
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME:300000}
      auto-commit: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: ${HIBERNATE_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}

  shutdown: graceful

  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
      - text/css
      - application/javascript

  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

  forward-headers-strategy: framework

spring.lifecycle:
  timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

  pattern:
    console: >-
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      %-5level
      [%thread]
      [%X{traceId:-},%X{spanId:-}]
      %logger{36}
      - %msg%n

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:file_processing}
      audience: ${JWT_AUDIENCE:file_processing-api}

      secret: ${JWT_SECRET:local-dev-only-change-this-secret-key-minimum-32-bytes}

      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:30d}
      clock-skew: ${JWT_CLOCK_SKEW:30s}

    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}

    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Requested-With,X-Correlation-Id}
      exposed-headers: ${CORS_EXPOSED_HEADERS:X-Correlation-Id}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
      max-age: ${CORS_MAX_AGE:3600}

  api:
    version: ${APP_API_VERSION:v1}
    prefix: ${APP_API_PREFIX:/api}

  pagination:
    default-page-size: ${DEFAULT_PAGE_SIZE:20}
    max-page-size: ${MAX_PAGE_SIZE:100}