spring:
  application:
    name: file_processing
    version: 1.0.0

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    banner-mode: console

  jackson:
    default-property-inclusion: non_null

  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${spring.application.name}-hikari
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME:300000}
      auto-commit: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: ${HIBERNATE_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:500MB}
      max-request-size: ${MAX_REQUEST_SIZE:500MB}

  rabbitmq:
    enabled: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rabbitmq_user}
    password: ${RABBITMQ_PASSWORD:rabbitmq_password}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
    url: http://localhost:8080

  swagger-ui:
    enabled: true
    path: /swagger-ui
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

  packages-to-scan:
    - com.vandunxg.file_processing.auth.api

  paths-to-match:
    - ${app.api.prefix}/${app.api.version}/**

server:
  port: ${SERVER_PORT:8080}

  shutdown: graceful

  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
      - text/css
      - application/javascript

  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

  forward-headers-strategy: framework

spring.lifecycle:
  timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}

  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: false

logging:
  file:
    path: /var/log/file-processing

  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

  pattern:
    console: >-
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      %-5level
      [%thread]
      [%X{traceId:-},%X{spanId:-}]
      %logger{36}
      - %msg%n

  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 10GB
      clean-history-on-start: false

app:
  gc:
    cron-time: 15 53 */4 * * *

  auth:
    jwt:
      issuer: ${AUTH_JWT_ISSUER:file-processing}
      audience: ${AUTH_JWT_AUDIENCE:file-processing-api}
      access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:PT15M}
      password-change-token-ttl: ${AUTH_JWT_PW_CHG_TOKEN_TTL:PT5M}
      clock-skew: ${AUTH_JWT_CLOCK_SKEW:PT60S}

      active-kid: ${AUTH_JWT_ACTIVE_KID}

      private-key-pem-base64: ${AUTH_JWT_PRIVATE_KEY_PEM}

      public-keys:
        - kid: ${AUTH_JWT_ACTIVE_KID}
          pem-base64: ${AUTH_JWT_ACTIVE_PUBLIC_KEY_PEM}

    password:
      encoder: bcrypt
      bcrypt-cost: ${AUTH_BCRYPT_COST:12}
      min-length: 8
      max-length: 128

    login:
      ip-max-per-hour: ${AUTH_LOGIN_IP_MAX_PER_HOUR:20}
      username-max-per-window: ${AUTH_LOGIN_USERNAME_MAX_PER_WINDOW:5}
      username-window: ${AUTH_LOGIN_USERNAME_WINDOW:PT15M}
      refresh-ip-max-per-hour: ${AUTH_REFRESH_IP_MAX_PER_HOUR:60}
      max-failures: 5
      failure-window: PT15M
      lock-duration: PT15M

    refresh:
      token-ttl: ${AUTH_REFRESH_TOKEN_TTL:PT168H}
      cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}

    session:
      credential-version-cache-ttl: ${AUTH_SESSION_CV_CACHE_TTL:PT5M}

    bootstrap:
      admin:
        enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
        username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:}
        email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
        password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
        display-name: ${AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:System Administrator}

    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: GET,POST,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept,X-Requested-With,X-CSRF-Token,X-Request-Id
      allow-credentials: true
      max-age: 3600

    register:
      max-attempts-per-hour: ${AUTH_REGISTER_MAX_PER_HOUR:10}

    email-verification:
      token-ttl: ${AUTH_EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
      base-url: ${AUTH_EMAIL_VERIFICATION_BASE_URL:http://localhost:5173/verify-email}
      resend-max-attempts-per-hour: ${AUTH_EMAIL_VERIFICATION_RESEND_MAX_PER_HOUR:10}

    password-reset:
      token-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:PT15M}
      base-url: ${AUTH_PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
      ip-max-attempts-per-hour: ${AUTH_PASSWORD_RESET_IP_MAX_PER_HOUR:20}
      identifier-max-attempts-per-window: ${AUTH_PASSWORD_RESET_IDENTIFIER_MAX_PER_WINDOW:5}
      identifier-window: ${AUTH_PASSWORD_RESET_IDENTIFIER_WINDOW:PT15M}

    cleanup:
      cadence: ${AUTH_CLEANUP_CADENCE:PT1H}
      batch-size: ${AUTH_CLEANUP_BATCH_SIZE:100}

    redis:
      throttle:
        key-prefix: ${AUTH_THROTTLE_REDIS_PREFIX:auth:throttle:}
        window: ${AUTH_THROTTLE_REDIS_WINDOW:PT1H}
      email-verification:
        token-key-prefix: ${AUTH_EMAIL_VERIFY_TOKEN_PREFIX:auth:email-verify:token:}
        user-key-prefix: ${AUTH_EMAIL_VERIFY_USER_PREFIX:auth:email-verify:user:}
      session:
        key-prefix: ${AUTH_SESSION_REDIS_PREFIX:auth:session:}
      refresh:
        key-prefix: ${AUTH_REFRESH_REDIS_PREFIX:auth:refresh:}
        used-key-prefix: ${AUTH_REFRESH_USED_REDIS_PREFIX:auth:refresh:used:}
        reuse-detection-window: ${AUTH_REFRESH_REUSE_WINDOW:PT60S}
      credential-version:
        key-prefix: ${AUTH_CV_REDIS_PREFIX:auth:user:cv:}
      user-sessions:
        key-prefix: ${AUTH_USER_SESSIONS_REDIS_PREFIX:auth:user:sessions:}

    amqp:
      exchange: ${AUTH_AMQP_EXCHANGE:auth.events}
      routing-key:
        action-log: ${AUTH_AMQP_ROUTING_ACTION_LOG:auth.action-log.recorded}
        audit-log: ${AUTH_AMQP_ROUTING_AUDIT_LOG:auth.audit-log.recorded}
        verification-email: ${AUTH_AMQP_ROUTING_VERIFY_EMAIL:auth.email.verification-requested}
        session-persist: ${AUTH_AMQP_ROUTING_SESSION_PERSIST:auth.session.persist}
        session-update: ${AUTH_AMQP_ROUTING_SESSION_UPDATE:auth.session.update}
        session-revoke: ${AUTH_AMQP_ROUTING_SESSION_REVOKE:auth.session.revoke}
      queue:
        action-log: ${AUTH_AMQP_QUEUE_ACTION_LOG:auth.action-log.queue}
        audit-log: ${AUTH_AMQP_QUEUE_AUDIT_LOG:auth.audit-log.queue}
        verification-email: ${AUTH_AMQP_QUEUE_VERIFY_EMAIL:auth.email-verification.queue}
        session-persist: ${AUTH_AMQP_QUEUE_SESSION_PERSIST:auth.session-persist.queue}
        session-update: ${AUTH_AMQP_QUEUE_SESSION_UPDATE:auth.session-update.queue}
        session-revoke: ${AUTH_AMQP_QUEUE_SESSION_REVOKE:auth.session-revoke.queue}

  api:
    version: ${APP_API_VERSION:v1}
    prefix: ${APP_API_PREFIX:/api}

  pagination:
    default-page-size: ${DEFAULT_PAGE_SIZE:20}
    max-page-size: ${MAX_PAGE_SIZE:100}

  file-import:
    retention: ${FILE_IMPORT_RETENTION:PT720H}
    storage:
      r2:
        endpoint: ${R2_ENDPOINT}
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        bucket: ${R2_BUCKET:file-processing}
        api-call-timeout: ${R2_API_CALL_TIMEOUT:PT30S}
