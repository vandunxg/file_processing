spring:
  mail:
    host: localhost
    port: 3025
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
  rabbitmq:
    enabled: true
logging:
  level:
    org.hibernate.SQL: INFO
    org.testcontainers: INFO

app:
  auth:
    jwt:
      issuer: file-processing-test
      audience: file-processing-api-test
      access-token-ttl: PT15M
      password-change-token-ttl: PT5M
      clock-skew: PT60S
      active-kid: auth-test-key-1
      # Non-production test-only RSA-2048 key; must not be reused outside this profile.
      private-key-pem-base64: 
      public-keys:
        - kid: auth-test-key-1
          pem-base64: 
    password:
      encoder: bcrypt
      bcrypt-cost: 4
      min-length: 8
      max-length: 128
    login:
      ip-max-per-hour: 20
      username-max-per-window: 5
      username-window: PT15M
      refresh-ip-max-per-hour: 60
      max-failures: 5
      failure-window: PT15M
      lock-duration: PT15M

    refresh:
      token-ttl: PT168H

    session:
      credential-version-cache-ttl: PT5M
    bootstrap:
      admin:
        enabled: false
    register:
      max-attempts-per-hour: 10
    email-verification:
      token-ttl: PT24H
      base-url: http://localhost:5173/verify-email
      resend-max-attempts-per-hour: 10
    password-reset:
      token-ttl: PT15M
      base-url: http://localhost:5173/reset-password
      ip-max-attempts-per-hour: 20
      identifier-max-attempts-per-window: 5
      identifier-window: PT15M

    redis:
      throttle:
        key-prefix: "test:auth:throttle:"
        window: PT1H
      email-verification:
        token-key-prefix: "test:auth:email-verify:token:"
        user-key-prefix: "test:auth:email-verify:user:"
      session:
        key-prefix: "test:auth:session:"
      refresh:
        key-prefix: "test:auth:refresh:"
        used-key-prefix: "test:auth:refresh:used:"
        reuse-detection-window: PT60S
      credential-version:
        key-prefix: "test:auth:user:cv:"
      user-sessions:
        key-prefix: "test:auth:user:sessions:"

    amqp:
      exchange: "test.auth.events"
      routing-key:
        audit-log: "test.auth.audit-log.recorded"
        verification-email: "test.auth.email.verification-requested"
        session-persist: "test.auth.session.persist"
        session-update: "test.auth.session.update"
        session-revoke: "test.auth.session.revoke"
      queue:
        audit-log: "test.auth.audit-log.queue"
        verification-email: "test.auth.email-verification.queue"
        session-persist: "test.auth.session-persist.queue"
        session-update: "test.auth.session-update.queue"
        session-revoke: "test.auth.session-revoke.queue"
